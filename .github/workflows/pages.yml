name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect static site
        run: |
          mkdir _site
          cp -r index.html style.css app.js avatars.js assets _site/
          # Pages кэширует файлы на 10 минут: без версии в ссылках браузер
          # смешивает новый index.html со старыми style.css/app.js.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html
          grep -q "?v=${GITHUB_SHA::8}" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
